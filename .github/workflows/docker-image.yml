name: CI and Docker image

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: raikiriww/readerarchive

jobs:
  docker:
    name: Verify and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull requests that only touch documentation skip the image build but
      # still report this job, which branch protection requires.
      - name: Detect docs-only pull request
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          printf '%s\n' "$files"
          code_files="$(printf '%s\n' "$files" | grep -vE '^(docs|designs)/|\.md$' || true)"
          if [ -n "$files" ] && [ -z "$code_files" ]; then
            echo "Docs-only change: skipping the Docker build and verification."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # The docker driver builds straight into the daemon's image store, so the
      # multi-GB image is not exported as a tarball and imported again.
      - name: Set up Docker Buildx
        if: steps.changes.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Registry pulls occasionally hang (one run waited 17 minutes on an 87 kB
      # layer). Pull the base image up front with a timeout and retries; the
      # build then uses the local copy.
      - name: Pull base image
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          base_image="$(awk '/^FROM /{image=$2} END{print image}' Dockerfile)"
          for attempt in 1 2 3; do
            if timeout 300 docker pull "$base_image"; then
              exit 0
            fi
            echo "::warning::Pulling $base_image failed or timed out (attempt $attempt)"
          done
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Validate Compose files
        run: |
          docker compose config >/dev/null
          docker compose -f compose.yaml -f compose.build.yaml config >/dev/null

      - name: Build local verification image
        if: steps.changes.outputs.docs_only != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: reader/archive-desktop:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Docker verification
        if: steps.changes.outputs.docs_only != 'true'
        env:
          READER_IMAGE: reader/archive-desktop:ci
          READER_VERIFY_SKIP_BUILD: "true"
        run: scripts/verify_in_docker.sh

      - name: Stop verification containers
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: docker compose -p reader_verify -f compose.yaml -f compose.build.yaml down -v

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push verified image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag reader/archive-desktop:ci "$tag"
            docker push "$tag"
          done <<EOF
          $PUBLISH_TAGS
          EOF

      - name: Check anonymous image access
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          docker logout "$REGISTRY"

          if ! docker manifest inspect "$REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME" >/dev/null; then
            echo "::error::Published image $REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME is not anonymously accessible. Open the GitHub package settings for readerarchive and change visibility to Public, then rerun this workflow."
            exit 1
          fi
